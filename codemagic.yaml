workflows:
  ios-testflight:
    name: iOS - TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: binome_admin_key
    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Désactiver Swift Package Manager (on reste 100% CocoaPods)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Fastlane — récupérer certificat/profil via match et configurer la signature
        # Réutilise exactement la même recette fastlane match que GitHub
        # Actions (certs stockés chiffrés dans binome-ios-certs) — l'outil
        # de signature automatique propre à Codemagic échouait à
        # persister la clé privée générée malgré plusieurs ajustements.
        script: |
          cd ios
          bundle install
          bundle exec fastlane ios sign
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --verbose
      - name: Fastlane — publier sur TestFlight
        script: |
          cd ios
          bundle exec fastlane ios publish
    artifacts:
      - build/ios/ipa/*.ipa
