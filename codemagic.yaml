workflows:
  ios-testflight:
    name: iOS - TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: binome_admin_key
    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Désactiver Swift Package Manager (on reste 100% CocoaPods)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Corriger la version de ScreenProtectorKit (bug de compilation en 1.5.1)
        # Même correctif que sur GitHub Actions : le plugin screen_protector
        # fige ScreenProtectorKit en dur à 1.5.1 (version buggée), le
        # Podfile pointe vers notre podspec local corrigé (1.5.2) mais
        # CocoaPods refuse tant que cette exigence 1.5.1 n'est pas patchée.
        script: |
          PODSPEC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -name "screen_protector-*" -type d | head -1)/ios/screen_protector.podspec
          sed -i '' "s/'ScreenProtectorKit', '1.5.1'/'ScreenProtectorKit', '1.5.2'/" "$PODSPEC"
          grep "ScreenProtectorKit" "$PODSPEC"
      - name: Fastlane — récupérer certificat/profil via match et configurer la signature
        # Réutilise exactement la même recette fastlane match que GitHub
        # Actions (certs stockés chiffrés dans binome-ios-certs) — l'outil
        # de signature automatique propre à Codemagic échouait à
        # persister la clé privée générée malgré plusieurs ajustements.
        script: |
          cd ios
          bundle install
          # TEMPORAIRE : le certificat stocké dans binome-ios-certs a été
          # révoqué pendant le dépannage de la signature auto Codemagic —
          # on force une régénération complète pour ce run. À retirer une
          # fois le build réussi (repasser en lecture seule par défaut).
          MATCH_READONLY=false MATCH_FORCE=true bundle exec fastlane ios sign
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --verbose
      - name: Fastlane — publier sur TestFlight
        script: |
          cd ios
          bundle exec fastlane ios publish
    artifacts:
      - build/ios/ipa/*.ipa
