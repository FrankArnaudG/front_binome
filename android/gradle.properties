org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Le cache incrémental Kotlin plante sur ce projet : les sources de certains
# plugins (ex. screen_protector) vivent sur C:\Users\...\pub-cache alors que
# le projet est sur E:\Binome — Kotlin essaie de calculer un chemin relatif
# entre les deux lecteurs ("this and base files have different roots"), ce
# qui n'a pas de solution sur Windows. Bug connu du compilateur Kotlin sur
# des configurations multi-lecteurs, pas quelque chose à corriger côté projet.
kotlin.incremental=false
