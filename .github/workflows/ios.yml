name: iOS build & TestFlight

# Déclenché à la main (bouton "Run workflow") ou sur un tag ios-v* — pas à
# chaque push, les runners macOS consomment des minutes bien plus vite que
# Linux (voir doc GitHub : macOS = 10x le coût en minutes).
on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

jobs:
  build-and-deploy:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner la dernière Xcode disponible (Swift 6 requis par certains pods)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Désactiver Swift Package Manager (on reste 100% CocoaPods)
        # Le SDK Firebase récupéré via SPM contient du Swift incompatible
        # avec le compilateur du runner (erreurs sur `sending`, etc.) —
        # le Podfile gère déjà toutes les pods, SPM n'est pas nécessaire.
        run: flutter config --no-enable-swift-package-manager

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Build (sans signature — fastlane/gym signe ensuite)
        run: flutter build ios --release --no-codesign

      - name: Fastlane — signer et publier sur TestFlight
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta
