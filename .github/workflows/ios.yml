name: iOS build & TestFlight

# Déclenché à la main (bouton "Run workflow") ou sur un tag ios-v* — pas à
# chaque push, les runners macOS consomment des minutes bien plus vite que
# Linux (voir doc GitHub : macOS = 10x le coût en minutes).
on:
  workflow_dispatch:
    inputs:
      fix_certs:
        description: "Régénérer le certificat/profil match (ponctuel — ex. certificat corrompu)"
        type: boolean
        default: false
  push:
    tags:
      - "ios-v*"

jobs:
  build-and-deploy:
    # macos-14 est en cours de dépréciation chez GitHub (suppression prévue
    # début novembre 2026) et son Xcode le plus récent (16.2) n'a pas le SDK
    # iOS 26+ requis par certains plugins (ex. device_info_plus). macos-15
    # embarque Xcode 26.x.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner la dernière Xcode disponible (Swift 6 requis par certains pods)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Corriger la version de ScreenProtectorKit (bug de compilation en 1.5.1)
        # Le plugin screen_protector fige ScreenProtectorKit en dur à 1.5.1,
        # une version dont la migration vers un framework binaire est cassée
        # (voir prongbang/ScreenProtectorKit#1.5.1 → corrigé en 1.5.2).
        # On patche le podspec mis en cache par pub pour pointer vers 1.5.2.
        run: |
          PODSPEC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -name "screen_protector-*" -type d | head -1)/ios/screen_protector.podspec
          sed -i '' "s/'ScreenProtectorKit', '1.5.1'/'ScreenProtectorKit', '1.5.2'/" "$PODSPEC"
          grep "ScreenProtectorKit" "$PODSPEC"

      - name: Désactiver Swift Package Manager (on reste 100% CocoaPods)
        # Le SDK Firebase récupéré via SPM contient du Swift incompatible
        # avec le compilateur du runner (erreurs sur `sending`, etc.) —
        # le Podfile gère déjà toutes les pods, SPM n'est pas nécessaire.
        run: flutter config --no-enable-swift-package-manager

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Fastlane — build, signer et publier sur TestFlight
        # Pas de `flutter build ios --no-codesign` séparé : même sans
        # signature, Flutter exige un Development Team sélectionné pour un
        # build device release. fastlane/gym (ci-dessous) fait tout le
        # cycle (compilation + archive + signature via match) en une
        # passe, une fois le certificat/profil installés.
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_READONLY: ${{ inputs.fix_certs && 'false' || 'true' }}
          MATCH_FORCE: ${{ inputs.fix_certs && 'true' || 'false' }}
        run: bundle exec fastlane beta
