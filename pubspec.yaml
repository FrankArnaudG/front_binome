name: binome_app2
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+2

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Icône WhatsApp fidèle (Material n'inclut aucun logo de marque) pour le
  # sélecteur appel/WhatsApp des contacts "Tenue" (voir demande
  # utilisateur : "le logo whatapp ne lui resemble pa").
  # ^11 requis : la 10.x sous-classe IconData, devenu `final` dans les
  # SDK Flutter récents (échec de compilation "can't be extended
  # outside of its library because it's a final class").
  font_awesome_flutter: ^11.0.0

  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  share_plus: ^10.1.4
  web_socket_channel: ^3.0.1
  emoji_picker_flutter: ^4.3.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  just_audio: ^0.9.42
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  cached_network_image: ^3.4.1
  # Mode "Jeu de Mémoire" présentiel connecté — Bluetooth/WiFi Direct sans
  # internet, Android uniquement (voir memory_game_transport_nearby.dart).
  nearby_connections: ^4.3.0
  sqflite: ^2.4.2
  path: ^1.9.1
  screen_protector: ^1.5.3
  path_provider: ^2.1.5
  # Voix en direct pendant une partie à deux téléphones (voir
  # VoiceCallService) — appel audio WebRTC, signalisation via Reverb
  # (VoiceSignal côté back), jamais de flux audio transitant par notre
  # backend.
  flutter_webrtc: ^0.12.9
  # Ouvre la page de paiement LigdiCash dans le navigateur externe (LigdiCash
  # bloque explicitement l'affichage en iframe/WebView, voir ShopScreen/
  # SubscriptionScreen._openPurchase).
  url_launcher: ^6.3.1
  # Lit le build number local (versionCode Android) pour le comparer à celui
  # publié côté serveur — voir AppUpdateChecker (demande utilisateur :
  # "comment fonctionne WhatsApp... mettre en place", même mécanisme).
  package_info_plus: ^8.1.2
  # Voix en direct en mode présentiel connecté (Nearby) — capture micro brute
  # (PCM16) envoyée directement sur le canal Bluetooth/Wifi Direct du jeu
  # (voir NearbyComms), jamais via WebRTC/serveur (contrairement au mode à
  # distance, voir VoiceCallService) — aucune connexion internet requise.
  record: ^6.2.1
  # Lecture temps réel du PCM16 reçu du binôme via NearbyComms (voir
  # ci-dessus) — just_audio (déjà utilisé ailleurs) ne convient pas à du
  # flux PCM brut en direct.
  flutter_pcm_sound: ^3.3.3
  # Vidéo en direct en mode présentiel connecté (Nearby) — capture caméra
  # (voir NearbyComms), jamais WebRTC : chaque image est encodée en JPEG
  # (petite résolution/fréquence, voir doc de classe) puis envoyée sur le
  # même canal Bluetooth/Wifi Direct que le jeu et la voix.
  camera: ^0.11.1
  # Encodage JPEG pur Dart (aucun encodeur matériel/plateforme nécessaire)
  # à partir des plans YUV420 bruts fournis par `camera` sur Android (voir
  # NearbyComms._convertYuv420ToJpeg).
  image: ^4.5.4
  # Guide pas à pas la première fois qu'un joueur ouvre un jeu (voir demande
  # utilisateur : "quelqu'un qui ne connaît pas le jeu... le guider à partir
  # du mode qu'il choisira") — bulles pointées sur les vrais boutons/zones
  # de l'écran, enchaînées à travers plusieurs écrans (choix du mode,
  # difficulté, plateau).
  showcaseview: ^5.1.0
  # "Notre distance" — position PONCTUELLE (jamais de suivi continu, voir
  # demande utilisateur), un seul relevé GPS à la demande.
  geolocator: ^13.0.2
  # Vraie carte pour "Notre distance" (voir demande utilisateur) — fond de
  # carte OpenStreetMap, choisi plutôt que Google Maps pour ne nécessiter
  # aucune clé API/compte Google Cloud (contrainte déjà validée avec
  # l'utilisateur pour cette fonctionnalité).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Sélecteur de couleur libre pour le doodle (voir DoodleComposeScreen),
  # en plus des pastilles présets.
  flutter_colorpicker: ^1.1.0
  crypto: ^3.0.7
  firebase_crashlytics: ^4.3.10
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/shop/
    - assets/logo/
    - assets/humeur/
    - assets/besoin/
    - assets/envi/
    - assets/categories_poeme_slide/
    - assets/heartbeat_categories/
    - assets/chat_themes/
    - assets/google_fonts/
    - assets/invitations/heritage_royal/
    - assets/invitations/icons/traditionnel/
    - assets/invitations/icons/musulman/
    - assets/invitations/icons/chretien/
    - assets/invitations/icons/civil/
    - assets/invitations/icons/reception/
    - assets/invitations/icons/photographie/
    - assets/invitations/icons/romantique/
    - assets/invitations/icons/logistique/
    - assets/invitations/icons/preparatifs/
    - assets/invitations/icons/famille/
    - assets/invitations/icons/animations/
    - assets/invitations/icons/universelles/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Icône de l'app (voir demande utilisateur — préférée à binome_logo2.png,
# qui a du texte illisible à cette taille et des bords bruités) — fond
# blush (AppColors.blush) plutôt que transparent, iOS exige une icône
# opaque (voir remove_alpha_ios).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/binome_logo1.png"
  adaptive_icon_background: "#FFF1EC"
  adaptive_icon_foreground: "assets/logo/binome_logo1.png"
  remove_alpha_ios: true
  background_color_ios: "#FFF1EC"
